    <p>
        "Sí, repite la hormiga,<br>
        he visto las estrellas.<br>
        subí al árbol más alto<br>
        que tiene la alameda<br>
        y vi miles de ojos<br>
        dentro de mis tinieblas."
    </p>

     <p>Extracto del poema <strong><em>Los encuentros de un caracol aventurero</em></strong>, de Federico García Lorca.</p>
